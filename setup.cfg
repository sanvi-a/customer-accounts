[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-erase=1
cover-package=accounts
cover-min-percentage=95

[coverage:run]
branch = True
source = accounts

[coverage:report]
show_missing = True
omit =
    tests/*

[flake8]
max-line-length = 127
max-complexity = 10
exclude = .git,__pycache__,venv,.venv,build,dist

[pylint.MASTER]
ignore = tests

[pylint.MESSAGES CONTROL]
disable = R0903,C0114

[pylint.FORMAT]
max-line-length = 127
