apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  workspaces:
    - name: pipeline-workspace
  params:
    - name: repo-url
    - name: branch
      default: main
    - name: build-image
  tasks:
    - name: init
      workspaces:
        - name: source
          workspace: pipeline-workspace
      taskRef:
        name: cleanup

    - name: clone
      workspaces:
        - name: output
          workspace: pipeline-workspace
      taskRef:
        name: git-clone
      runAfter: [init]
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.branch)

    - name: lint
      workspaces:
        - name: source
          workspace: pipeline-workspace
      taskRef:
        name: flake8
      runAfter: [clone]
      params:
        - name: image
          value: "python:3.11-slim"
        - name: args
          value: ["--count", "--max-complexity=10", "--max-line-length=127", "--statistics"]

    - name: tests
      workspaces:
        - name: source
          workspace: pipeline-workspace
      taskRef:
        name: nose
      runAfter: [clone]
      params:
        - name: database_uri
          value: "sqlite://"
        - name: args
          value: "-v --with-spec --spec-color"

    - name: build
      workspaces:
        - name: source
          workspace: pipeline-workspace
      taskRef:
        name: buildah
      runAfter: [lint, tests]
      params:
        - name: IMAGE
          value: "$(params.build-image)"
        - name: TLSVERIFY
          value: "false"

    - name: deploy
      workspaces:
        - name: manifest-dir
          workspace: pipeline-workspace
      taskRef:
        name: openshift-client
      runAfter: [build]
      params:
        - name: SCRIPT
          value: |
            echo "Updating manifest..."
            sed -i "s|image: .*|image: $(params.build-image)|" kubernetes/deployment.yaml
            cat kubernetes/deployment.yaml
            echo "Deploying to cluster..."
            oc apply -f kubernetes/
            oc get pods -l app=accounts
